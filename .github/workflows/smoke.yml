name: smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requires-python is >=3.9. The matrix is what proves it, not the claim.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile everything
        run: python -m compileall -q codereconwork dev

      - name: Smoke suites (bare env, zero dependencies)
        # The bare run is the one that matters: the project promises stdlib only.
        run: |
          for f in dev/smoke*.py; do
            echo "--- $f"
            python "$f"
          done

      - name: Smoke suites (with the optional extras installed)
        # The bare run above skips the rich terminal backend. Install the extras and
        # re-run so both painters actually get exercised somewhere in CI.
        run: |
          pip install '.[pretty,yaml]'
          python dev/smoke_report.py
          python dev/smoke.py

      - name: Install and run the CLI for real
        run: |
          pip install .
          recon --version
          recon rules --json > /dev/null
          # Scanning itself finds planted fixture credentials, so exit 1 is correct here.
          recon code . --no-color --quiet --json report.json || test $? -eq 1
          python -c "import json; d=json.load(open('report.json')); assert d['findings'], 'no findings'; print(len(d['findings']), 'findings')"
